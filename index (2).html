<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake • Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        :root {
            --primary: #00ff9d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Inter', system_ui, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        
        .game-wrapper {
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00ff9d, #00cc7a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        
        .stats {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        .stat {
            text-align: right;
        }
        
        .stat-label {
            font-size: 0.75rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: #00ff9d;
        }
        
        .canvas-container {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4),
                        0 0 0 1px rgba(255,255,255,0.08);
            background: #111114;
        }
        
        #gameCanvas {
            display: block;
            image-rendering: crisp-edges;
        }
        
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            z-index: 10;
            border-radius: 24px;
        }
        
        .overlay.hidden {
            display: none;
        }
        
        .menu {
            text-align: center;
            padding: 32px;
        }
        
        .menu h2 {
            font-size: 1.75rem;
            margin-bottom: 8px;
            color: #fff;
        }
        
        .menu p {
            opacity: 0.7;
            margin-bottom: 24px;
        }
        
        .btn {
            background: #00ff9d;
            color: #0a0a0f;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 255 157 / 0.3);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            margin-top: 12px;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }
        
        .control-btn {
            width: 52px;
            height: 52px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
        }
        
        .control-btn:active {
            background: rgba(0, 255, 157, 0.2);
            transform: scale(0.95);
        }
        
        .settings {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .setting-btn {
            padding: 8px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .setting-btn.active {
            background: #00ff9d;
            color: #0a0a0f;
            border-color: #00ff9d;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.5;
        }
        
        .sound-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.08);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- Header -->
        <div class="header">
            <div>
                <div class="title">Snake</div>
                <div style="font-size:0.9rem; opacity:0.6; margin-top:-4px;">Professional Edition</div>
            </div>
            
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Score</div>
                    <div id="score" class="stat-value">000</div>
                </div>
                <div class="stat">
                    <div class="stat-label">High Score</div>
                    <div id="highScore" class="stat-value">000</div>
                </div>
            </div>
        </div>

        <!-- Game Canvas -->
        <div class="canvas-container">
            <canvas id="gameCanvas" width="480" height="480"></canvas>
            
            <!-- Start Screen -->
            <div id="startScreen" class="overlay">
                <div class="menu">
                    <h2>Ready to Play?</h2>
                    <p>Use arrow keys or swipe to move</p>
                    
                    <button onclick="startGame()" class="btn">Start Game</button>
                    
                    <div class="settings">
                        <div onclick="setDifficulty(0)" id="diff0" class="setting-btn active">Slow</div>
                        <div onclick="setDifficulty(1)" id="diff1" class="setting-btn">Normal</div>
                        <div onclick="setDifficulty(2)" id="diff2" class="setting-btn">Fast</div>
                    </div>
                    
                    <div style="margin-top: 20px; font-size: 0.75rem; opacity: 0.6;">
                        Press <strong>Space</strong> to pause
                    </div>
                </div>
            </div>
            
            <!-- Game Over Screen -->
            <div id="gameOverScreen" class="overlay hidden">
                <div class="menu">
                    <h2 style="color:#ff6b6b">Game Over</h2>
                    <div style="font-size: 3rem; font-weight: 700; margin: 12px 0; color: #00ff9d;" id="finalScore">000</div>
                    
                    <button onclick="restartGame()" class="btn">Play Again</button>
                    <button onclick="showStartScreen()" class="btn btn-secondary">Main Menu</button>
                </div>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div id="mobileControls" class="controls" style="display: none; margin-top: 20px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 180px; margin: 0 auto;">
                <div></div>
                <div onclick="mobileMove(0, -1)" class="control-btn">↑</div>
                <div></div>
                <div onclick="mobileMove(-1, 0)" class="control-btn">←</div>
                <div onclick="mobileMove(0, 1)" class="control-btn">↓</div>
                <div onclick="mobileMove(1, 0)" class="control-btn">→</div>
            </div>
        </div>

        <div class="footer">
            Professional Snake • Touch &amp; Keyboard Supported
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        const GRID_SIZE = 24;
        const CELL_SIZE = 20;
        
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameInterval = null;
        let difficulty = 1; // 0 = slow, 1 = normal, 2 = fast
        let particles = [];
        let soundEnabled = true;

        // Audio Context for sound effects
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            
            try {
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                oscillator.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'eat') {
                    oscillator.type = 'sine';
                    oscillator.frequency.value = 880;
                    gain.gain.value = 0.3;
                    filter.type = 'lowpass';
                    filter.frequency.value = 1200;
                    
                    setTimeout(() => {
                        oscillator.frequency.value = 1320;
                    }, 80);
                    
                    setTimeout(() => {
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    }, 120);
                } else if (type === 'die') {
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.value = 180;
                    gain.gain.value = 0.4;
                    filter.type = 'lowpass';
                    filter.frequency.value = 800;
                    
                    setTimeout(() => {
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                    }, 50);
                }
                
                oscillator.start();
                
                setTimeout(() => {
                    oscillator.stop();
                }, type === 'eat' ? 280 : 700);
            } catch(e) {}
        }

        function updateHighScore() {
            document.getElementById('highScore').textContent = highScore.toString().padStart(3, '0');
        }

        function setDifficulty(level) {
            difficulty = level;
            
            // Update UI
            document.getElementById('diff0').classList.toggle('active', level === 0);
            document.getElementById('diff1').classList.toggle('active', level === 1);
            document.getElementById('diff2').classList.toggle('active', level === 2);
        }

        function drawRoundedRect(x, y, width, height, radius, fillStyle) {
            ctx.fillStyle = fillStyle;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            ctx.save();
            
            // Background
            ctx.fillStyle = '#111114';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Subtle grid
            ctx.strokeStyle = '#1a1a20';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // Draw snake with professional styling
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                
                // Main body
                if (i === 0) {
                    // Head - gradient + shadow
                    const gradient = ctx.createLinearGradient(x, y, x + CELL_SIZE, y + CELL_SIZE);
                    gradient.addColorStop(0, '#00ff9d');
                    gradient.addColorStop(1, '#00cc7a');
                    
                    ctx.shadowColor = 'rgba(0, 255, 157, 0.5)';
                    ctx.shadowBlur = 12;
                    drawRoundedRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, 7, gradient);
                    ctx.shadowBlur = 0;
                    
                    // Eyes
                    ctx.fillStyle = '#0a0a0f';
                    const eyeOffset = 5;
                    const eyeSize = 4.5;
                    
                    let eyePositions = [];
                    
                    if (direction.x === 1) { // right
                        eyePositions = [
                            {x: x + CELL_SIZE - eyeOffset - 3, y: y + eyeOffset},
                            {x: x + CELL_SIZE - eyeOffset - 3, y: y + CELL_SIZE - eyeOffset - 4}
                        ];
                    } else if (direction.x === -1) { // left
                        eyePositions = [
                            {x: x + eyeOffset, y: y + eyeOffset},
                            {x: x + eyeOffset, y: y + CELL_SIZE - eyeOffset - 4}
                        ];
                    } else if (direction.y === -1) { // up
                        eyePositions = [
                            {x: x + eyeOffset, y: y + eyeOffset},
                            {x: x + CELL_SIZE - eyeOffset - 4, y: y + eyeOffset}
                        ];
                    } else { // down
                        eyePositions = [
                            {x: x + eyeOffset, y: y + CELL_SIZE - eyeOffset - 3},
                            {x: x + CELL_SIZE - eyeOffset - 4, y: y + CELL_SIZE - eyeOffset - 3}
                        ];
                    }
                    
                    eyePositions.forEach(pos => {
                        ctx.fillRect(pos.x, pos.y, eyeSize, eyeSize);
                    });
                    
                } else {
                    // Body segments
                    const alpha = Math.max(0.65, 1 - (i * 0.04));
                    ctx.fillStyle = `rgba(0, 204, 122, ${alpha})`;
                    drawRoundedRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6, ctx.fillStyle);
                }
            }

            // Draw food (professional apple)
            const fx = food.x * CELL_SIZE;
            const fy = food.y * CELL_SIZE;
            
            // Shadow
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 3;
            
            // Apple body
            const appleGradient = ctx.createRadialGradient(
                fx + 7, fy + 7, 3, 
                fx + CELL_SIZE/2, fy + CELL_SIZE/2, 12
            );
            appleGradient.addColorStop(0, '#ff6b6b');
            appleGradient.addColorStop(1, '#e63946');
            
            ctx.fillStyle = appleGradient;
            ctx.beginPath();
            ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, 9, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            
            // Leaf
            ctx.fillStyle = '#2a9d8f';
            ctx.beginPath();
            ctx.ellipse(fx + CELL_SIZE/2 + 3, fy + 5, 5, 3, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Stem
            ctx.strokeStyle = '#264653';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(fx + CELL_SIZE/2, fy + 4);
            ctx.quadraticCurveTo(fx + CELL_SIZE/2 + 2, fy - 1, fx + CELL_SIZE/2 + 4, fy - 2);
            ctx.stroke();
            
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.beginPath();
            ctx.arc(fx + CELL_SIZE/2 - 3, fy + CELL_SIZE/2 - 3, 3, 0, Math.PI * 2);
            ctx.fill();

            // Draw particles
            ctx.fillStyle = '#00ff9d';
            for (let p of particles) {
                ctx.globalAlpha = p.life / 20;
                ctx.fillRect(p.x, p.y, 3, 3);
            }
            ctx.globalAlpha = 1;
            
            ctx.restore();
        }

        function update() {
            if (!gameRunning || gamePaused) return;

            direction = {...nextDirection};

            const head = {...snake[0]};
            head.x += direction.x;
            head.y += direction.y;

            // Wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                endGame();
                return;
            }

            // Self collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food
            let ateFood = false;
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score.toString().padStart(3, '0');
                playSound('eat');
                ateFood = true;
                
                // Create particles
                for (let i = 0; i < 12; i++) {
                    particles.push({
                        x: food.x * CELL_SIZE + Math.random() * CELL_SIZE,
                        y: food.y * CELL_SIZE + Math.random() * CELL_SIZE,
                        life: 20 + Math.random() * 10
                    });
                }
                
                generateFood();
            } else {
                snake.pop();
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].life--;
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            draw();
        }

        function generateFood() {
            let newFood;
            let valid = false;
            
            while (!valid) {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                valid = true;
                
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        valid = false;
                        break;
                    }
                }
            }
            food = newFood;
        }

        function changeDirection(newDir) {
            if (newDir.x === -direction.x && newDir.y === -direction.y) return;
            nextDirection = newDir;
        }

        function handleKeyboard(e) {
            if (!gameRunning || gamePaused) {
                if (e.key === ' ' && gameRunning) {
                    togglePause();
                }
                return;
            }
            
            let handled = true;
            
            switch (e.key.toLowerCase()) {
                case 'arrowup': case 'w': changeDirection({x:0, y:-1}); break;
                case 'arrowdown': case 's': changeDirection({x:0, y:1}); break;
                case 'arrowleft': case 'a': changeDirection({x:-1, y:0}); break;
                case 'arrowright': case 'd': changeDirection({x:1, y:0}); break;
                case ' ': 
                    e.preventDefault();
                    togglePause();
                    break;
                default: handled = false;
            }
            
            if (handled) e.preventDefault();
        }

        function mobileMove(dx, dy) {
            if (!gameRunning || gamePaused) return;
            changeDirection({x: dx, y: dy});
        }

        function startGame() {
            // Reset state
            snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            particles = [];
            
            document.getElementById('score').textContent = '000';
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            generateFood();
            draw();
            
            gameRunning = true;
            gamePaused = false;
            
            const speeds = [180, 130, 85];
            const currentSpeed = speeds[difficulty];
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(update, currentSpeed);
            
            initAudio();
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            playSound('die');
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                updateHighScore();
            }
            
            document.getElementById('finalScore').textContent = score.toString().padStart(3, '0');
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            startGame();
        }

        function showStartScreen() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            gameRunning = false;
            if (gameInterval) clearInterval(gameInterval);
        }

        function setupMobileControls() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const mobileControls = document.getElementById('mobileControls');
            
            if (isMobile) {
                mobileControls.style.display = 'flex';
            }
            
            // Touch swipe support
            let startX, startY;
            
            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, {passive: false});
            
            canvas.addEventListener('touchend', function(e) {
                if (!gameRunning || gamePaused || !startX) return;
                e.preventDefault();
                
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                
                const dx = endX - startX;
                const dy = endY - startY;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 40) changeDirection({x:1, y:0});
                    else if (dx < -40) changeDirection({x:-1, y:0});
                } else {
                    if (dy > 40) changeDirection({x:0, y:1});
                    else if (dy < -40) changeDirection({x:0, y:-1});
                }
                
                startX = null;
                startY = null;
            }, {passive: false});
        }

        // Initialize everything
        function init() {
            updateHighScore();
            document.getElementById('highScore').textContent = highScore.toString().padStart(3, '0');
            
            // Keyboard
            document.addEventListener('keydown', handleKeyboard);
            
            // Initial draw
            snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
            generateFood();
            draw();
            
            // Mobile setup
            setupMobileControls();
            
            // Show start screen by default
            document.getElementById('startScreen').classList.remove('hidden');
        }
        
        init();
    </script>
</body>
</html>
